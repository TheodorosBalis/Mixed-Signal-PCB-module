<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370" role="img" aria-labelledby="title desc">
<title id="title">Mixed-Signal PCB Module - System Block Diagram</title>
<desc id="desc">Block diagram derived from the KiCad schematic. A BQ24166 charger supplies the M95 and a TC2014 3.3 volt regulator. The STM32 connects to the display, SWD connector, crystal, keypad and power key logic. The M95 connects to the SIM, RF matching and external antenna, microphone, speaker, and status LEDs. Resistor networks and a PWRKEY transistor connect the MCU and GSM module.</desc>
